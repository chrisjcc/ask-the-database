# -----------------------------------------------------------------------------
# DVC Experiment Parameters
# -----------------------------------------------------------------------------
# These values define the baseline/default parameter state for data preprocessing
# and model training pipelines. W&B sweeps override these values on a per-experiment
# trial basis via scripts/run_sweep_trial.py without altering base Hydra configs.

preprocess:
  dataset_name: "spider"
  include_skyrl_653: true
  max_tokens: 2048
  train_split: 0.9
  val_split: 0.1
  seed: 42

sft:
  learning_rate: 2.0e-5
  num_train_epochs: 3
  lora:
    r: 16

grpo:
  learning_rate: 1.0e-6
  beta_kl: 0.04
  group_size: 4
  max_steps: 250
