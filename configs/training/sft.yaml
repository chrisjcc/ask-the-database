output_dir: "models/sft/final"
learning_rate: 2.0e-5
num_train_epochs: 3
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
warmup_steps: 10
weight_decay: 0.01
bf16: false
logging_steps: 5
save_strategy: "epoch"
report_to: "none"
max_steps: -1
max_seq_length: 2048

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
