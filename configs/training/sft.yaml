# -----------------------------------------------------------------------------
# Supervised Fine-Tuning (SFT) Warmup Configuration (AskTheDatabase)
# Hugging Face TRL SFTTrainer + PEFT LoRA / rsLoRA
# -----------------------------------------------------------------------------
# Configuration for policy warmup fine-tuning using Hugging Face TRL SFTTrainer
# supporting both single-turn pairs (Condition 2) and multi-turn trajectories (Condition 4).

# --- Global & Paths ---
output_dir: "models/sft/final"             # Directory to save fine-tuned policy adapter
dataset_path: null                         # Primary dataset path (train.jsonl or reviewed_trajectories.jsonl)
train_data_path: null                      # Dataset path alias for Hydra compatibility
val_dataset_path: null                     # Optional validation split (e.g. data/processed/val.jsonl)

# --- Batching & Epochs ---
num_train_epochs: 3                        # Total number of training epochs
per_device_train_batch_size: 2             # Micro-batch size per GPU
gradient_accumulation_steps: 8             # Number of steps to accumulate gradients
max_steps: -1                              # Max training steps (-1 uses num_train_epochs)

# --- Optimization & Loss ---
learning_rate: 2.0e-5                      # Peak learning rate (AdamW)
warmup_steps: 10                           # Warmup steps for cosine learning rate schedule
weight_decay: 0.01                         # Weight decay regularization
bf16: false                                # Use bfloat16 precision (auto-detected on Ampere+)
fp16: false                                # Use float16 precision if bf16 is not supported
max_seq_length: 2048                       # Maximum token sequence length for ChatML prompts

# --- Memory Optimization ---
gradient_checkpointing: true               # Enable gradient checkpointing to reduce memory
dataloader_num_workers: 0                  # Dataloader worker count
packing: false                             # Sequence packing for SFTTrainer

# --- Logging & Saving ---
logging_steps: 5                           # How often to log training metrics
save_strategy: "epoch"                     # How often to save a checkpoint ("epoch", "steps", "no")
report_to: "wandb"                         # Integration to report metrics to ("wandb", "none")

wandb:
  enabled: true                            # Enable Weights & Biases telemetry
  project: "ask-the-database"              # Target W&B project name

# -----------------------------------------------------------------------------
# LoRA Configuration
# -----------------------------------------------------------------------------

lora:
  enabled: true                            # Whether to use PEFT LoRA adapter (false for full fine-tuning)

  # Adapter configuration
  r: 16                                    # LoRA rank dimension
  lora_alpha: 32                           # LoRA scaling parameter (alpha)
  lora_dropout: 0.05                       # Adapter dropout

  # false = Standard LoRA (scaling: s = alpha / r)
  # true  = Rank-Stabilized LoRA (rsLoRA, scaling: s = alpha / sqrt(r))
  use_rslora: false

  # Target modules for adapter injection (explicit list or string shortcut e.g. "all-linear")
  target_modules: "all-linear"

  # Optional adapter configuration
  bias: "none"                             # Bias training mode ("none", "all", "lora_only")
  modules_to_save: null                    # Additional modules to train and save (list or null)

  # Initialization strategy
  init_lora_weights: true                  # Initialization strategy (true, "gaussian", etc.)

# -----------------------------------------------------------------------------
# Quantization (QLoRA) Configuration
# -----------------------------------------------------------------------------

quantization:
  enabled: false                           # Whether to enable 4-bit / 8-bit QLoRA
  load_in_4bit: true                       # Load model in 4-bit precision (QLoRA)
  load_in_8bit: false                      # Load model in 8-bit precision (mutually exclusive with 4-bit)
  bnb_4bit_quant_type: "nf4"               # 4-bit quantization type ("nf4" or "fp4")
  bnb_4bit_use_double_quant: true          # Enable nested / double quantization for memory savings
  bnb_4bit_compute_dtype: "bfloat16"       # Compute dtype for 4-bit ("bfloat16", "float16", "float32")

