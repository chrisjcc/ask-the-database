output_dir: "models/grpo_baseline/final"
learning_rate: 1.0e-5
num_train_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
num_generations: 8
max_completion_length: 512
beta: 0.04
logging_steps: 1
save_strategy: "epoch"
report_to: "wandb"
wandb:
  enabled: true
  project: "ask-the-database"
max_steps: -1

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
