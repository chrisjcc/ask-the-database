model_path: "models/rlvr/final"
benchmarks:
  - "spider"
max_samples: null
max_turns: 5
output_dir: "results"
summary_file: "results/evaluation_summary.json"
metrics:
  - ts
  - ex
  - va
  - mrr
# Verification settings:
# verification_mode options: "none", "query" (single-turn SQL ranker), "trajectory" (multi-turn trajectory verifier)
verification_mode: "none"
use_verifier: false
use_trajectory_verifier: false
num_candidates: 5
temperature: 0.7
